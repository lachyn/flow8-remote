<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b434a"/>
      <stop offset="1" stop-color="#23282d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc766"/>
      <stop offset="1" stop-color="#f29b1d"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#b9c0c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- stem = fader slot -->
  <rect x="150" y="96" width="34" height="320" rx="17" fill="#0e1012"/>
  <!-- F arms -->
  <rect x="150" y="96" width="232" height="72" rx="22" fill="url(#amber)"/>
  <rect x="150" y="226" width="176" height="64" rx="20" fill="url(#amber)"/>
  <!-- fader cap on the stem -->
  <rect x="118" y="330" width="98" height="58" rx="12" fill="url(#cap)"/>
  <rect x="128" y="356" width="78" height="7" rx="3" fill="#1a1d20"/>
</svg>
